<script>/* 11-25 사용자 요청: 폰이 다크 모드여도 항상 밝은 아이보리 화면 */document.documentElement.setAttribute('data-theme','light')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Direction: a flat, quiet app. One sans family, light large numerals, one green accent for actions and selection.
   Surfaces separate by tone (ground → surface → surface-2), not by shadows or frames. The week board is a flat deep-green field.
   Layout: phone-width column, sticky column header on 출석, fixed bottom tab bar. */
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EDE8; --line:#DFE4DD;
  --ink:#111A14; --ink-2:#47534A; --ink-3:#7E8A81;
  --leaf:#1E5B3A; --leaf-ink:#FFFFFF; --leaf-soft:#DCE8DF;
  --sky:#3E6AA8; --sky-ink:#FFFFFF; --sky-soft:#E0E8F3;
  --gold:#A8761C; --gold-ink:#FFFFFF; --gold-soft:#F2E8D2;
  --deep:#173F2A; --deep-hi:#21513A; --deep-lo:#123321; --deep-ink:#F1F5F0; --deep-2:#A3BEAB;
  --deep-line:rgba(241,245,240,.14); --deep-fill:rgba(241,245,240,.07);
  --b-site:#86D3A2; --b-online:#A3BEF0; --b-main:#E6BC62; --b-cell:#F1F5F0;
  --card-ivory:#FFFFFF;
  --k-site-on:#86D3A2; --k-online-on:#A3BEF0; --k-main-on:#E6BC62;
  --gold-glow:transparent; --gold-line:transparent; --gold-line-strong:rgba(241,245,240,.2);
  --logo-bg:#F8FBF6; --logo-line:#D3E3D2; --logo-leaf:#237A47; --logo-leaf-2:#56B87A; --logo-stem:#2A7148;
  --scrim:rgba(10,20,14,.45); --danger:#B23A26;
  --shadow:0 12px 32px -12px rgba(10,20,14,.28);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-ui);
  --col:460px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1310; --surface:#161D18; --surface-2:#1F2721; --line:#29332C;
  --ink:#E6ECE7; --ink-2:#A9B5AC; --ink-3:#6F7C73;
  --leaf:#6CC08E; --leaf-ink:#0B1A10; --leaf-soft:#1D3326;
  --sky:#8AAEE6; --sky-ink:#0B1424; --sky-soft:#1D2A40;
  --gold:#DDB25E; --gold-ink:#241A04; --gold-soft:#3A3020;
  --deep:#143323; --deep-hi:#1C4430; --deep-lo:#0F2619;
  --scrim:rgba(0,0,0,.6); --danger:#F08A74;
  --shadow:0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0E1310; --surface:#161D18; --surface-2:#1F2721; --line:#29332C;
  --ink:#E6ECE7; --ink-2:#A9B5AC; --ink-3:#6F7C73;
  --leaf:#6CC08E; --leaf-ink:#0B1A10; --leaf-soft:#1D3326;
  --sky:#8AAEE6; --sky-ink:#0B1424; --sky-soft:#1D2A40;
  --gold:#DDB25E; --gold-ink:#241A04; --gold-soft:#3A3020;
  --deep:#143323; --deep-hi:#1C4430; --deep-lo:#0F2619;
  --scrim:rgba(0,0,0,.6); --danger:#F08A74;
  --shadow:0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.app{max-width:var(--col);margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:4px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:30px;height:30px;flex:none}
.lg-bg{fill:var(--logo-bg);stroke:var(--logo-line);stroke-width:1}
.lg-st{stroke:var(--logo-stem);stroke-width:2.1;stroke-linecap:round;fill:none}
.lg-soil{stroke:var(--logo-leaf-2);stroke-width:1.6;stroke-linecap:round;opacity:.45}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brand small{display:inline;margin-left:6px;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);white-space:nowrap;margin-right:4px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.draft{font-size:11.5px;color:var(--ink-3);margin:0 0 10px}

/* home */
.home-h{display:flex;align-items:flex-end;gap:12px;margin:2px 0 14px}
.home-h > div{flex:1;min-width:0}
.home-h p{margin:0;font-size:13px;color:var(--ink-3)}
.home-h h2{margin:2px 0 0;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.025em;text-wrap:balance}
.cta{flex:none;border:0;border-radius:999px;padding:9px 14px 9px 16px;background:var(--leaf);color:var(--leaf-ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cta svg{width:15px;height:15px}

/* week board: flat deep-green field */
.board{position:relative;background:var(--deep);color:var(--deep-ink);border-radius:18px;padding:12px}
.board .mark{display:none}
.wk{display:flex;align-items:center;gap:2px;margin:0 0 10px}
.wk .t{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.wk .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--deep-2)}
.wk .now{font-size:12px;font-weight:600;color:var(--b-site);background:none;padding:0}
.wk .t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:1px}
.wbtn{width:32px;height:32px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--deep-2);display:grid;place-items:center;padding:0}
.wbtn:hover{background:var(--deep-fill);color:var(--deep-ink)}
.wbtn:disabled{opacity:.3;cursor:default}
.wbtn svg{width:17px;height:17px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.dcol{text-align:left;border:0;background:transparent;border-radius:12px;padding:12px;color:var(--deep-ink);display:flex;flex-direction:column;min-width:0;transition:background-color .2s}
.dcol:hover{background:var(--deep-fill)}
.dcol[aria-pressed="true"]{background:var(--deep-hi)}
.c-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;white-space:nowrap}
.c-h b{font-size:13px;font-weight:600}
.c-h em{font-style:normal;font-size:12px;color:var(--deep-2);font-variant-numeric:tabular-nums}
.c-tot{display:flex;align-items:baseline;gap:3px;font-size:40px;font-weight:300;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:10px 0 0}
.c-tot small{font-size:13px;font-weight:400;color:var(--deep-2);letter-spacing:0}
.c-bar{display:flex;gap:2px;height:2px;border-radius:2px;overflow:hidden;background:var(--deep-line);margin:10px 0}
.c-bar i{display:block;height:100%;transition:width .4s ease}
.c-br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;font-size:12.5px;margin:0}
.c-br dt{display:flex;align-items:center;gap:7px;color:var(--deep-2);white-space:nowrap;overflow:hidden}
.c-br dd{margin:0;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.c-br .sep{grid-column:1/-1;border-top:1px solid var(--deep-line);margin:3px 0 1px}
.dot{flex:none;width:6px;height:6px;border-radius:50%}
.k-site{background:var(--b-site)} .k-online{background:var(--b-online)} .k-main{background:var(--b-main)}
.dot.k-cell{background:transparent;box-shadow:inset 0 0 0 1.5px var(--b-cell)}
.c-note{margin-top:auto;padding-top:10px;font-size:12px;color:var(--deep-2)}

/* home sections */
.sec{margin-top:24px}
.sec-t{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-t h3{margin:0;flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-t > span{font-size:13px;color:var(--ink-3)}
.pill-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:500;color:var(--ink-2)}
.pill-btn svg{width:14px;height:14px}
.notices,.bdlist{background:var(--surface);border-radius:14px;overflow:hidden}
.nt{border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt-main{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;align-items:start;color:var(--ink)}
.nd{display:flex;flex-direction:column;align-items:flex-start;padding-top:1px;color:var(--ink)}
.nd small{font-size:11.5px;line-height:1.2;color:var(--ink-3)}
.nd b{font-size:20px;font-weight:400;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nd.up b{color:var(--leaf);font-weight:500}
.nd svg{display:none}
.nd:not(:has(b))::after{content:"안내";font-size:12px;font-weight:500;color:var(--ink-3);padding-top:2px}
.nt-txt{min-width:0;display:block}
.nt-title{display:block;font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.nt-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font-size:13.5px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.nt.open .nt-body{display:block;overflow:visible}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.dday{font-weight:600;color:var(--leaf)}
.dday.soon{color:var(--gold)}
.dday.past{color:var(--ink-3);font-weight:400}
.bellm{display:inline-flex;align-items:center;gap:3px}
.bellm svg{width:12px;height:12px}
.nt.past{opacity:.65}
.nt-act{display:flex;justify-content:flex-end;gap:6px;padding:0 14px 12px}
.mini{border:0;background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.mini.danger{color:var(--danger)}
.bdlist{list-style:none;margin:0;padding:0}
.bdlist li{border-bottom:1px solid var(--line)}
.bdlist li:last-child{border-bottom:0}
.bdlist li:has(+ li.gcont){border-bottom-color:transparent}
.bdrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;color:var(--ink);font-size:15px}
.bdlist li.gcont .bdrow{padding-top:0}
.bdcell{font-size:13px;font-weight:500;color:var(--leaf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bddate{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 출석 */
.entry-h{display:flex;align-items:flex-end;gap:10px;margin:20px 0 0}
.entry-h h2{flex:1;margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.entry-h p{margin:0;font-size:12px;color:var(--ink-3)}
.search{position:relative;margin:12px 0 8px}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;box-sizing:border-box;border:0;background:var(--surface);border-radius:12px;padding:10px 12px 10px 36px;font-size:15px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--leaf)}
.scrollx{display:flex;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.scrollx::-webkit-scrollbar{display:none}
.scrollx::after{content:"";flex:0 0 1px}
.chips{gap:6px;padding-block:1px}
.chip{flex:0 0 auto;border:0;background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.colhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--ground);display:flex;align-items:flex-end;gap:8px;padding:10px 0 6px;margin-top:6px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.colhead .nmh{flex:1}
.ctl,.ctlh{display:flex;gap:4px;flex:none;align-items:center}
.ctlh span{text-align:center;white-space:nowrap}
.ctlh .grp{position:relative;display:block;text-align:center}
.ctlh .grp i{position:absolute;left:6px;right:6px;bottom:-5px;height:4px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;box-sizing:border-box}
.w-a{width:48px} .w-m{width:52px} .w-c{width:44px;margin-left:6px} .w-f{width:62px}
.group{margin-top:12px}
.ghead{display:flex;align-items:center;gap:8px;padding:8px 0 4px}
.ghead h3{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.ghead h3 span{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:6px}
.gcount{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.allbtn{border:0;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap}
.prow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.prow.remote{animation:remote 1.8s ease-out}
@keyframes remote{0%,55%{background:var(--gold-soft)}100%{background:transparent}}
.who{flex:1;min-width:0;border:0;background:none;padding:4px 0;text-align:left;display:flex;flex-direction:column}
.who b{font-size:15px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:11px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{height:34px;border-radius:999px;border:0;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-3);padding:0;display:grid;place-items:center;transition:background-color .15s,color .15s,transform .1s;touch-action:manipulation}
.opt:active{transform:scale(.94)}
.opt svg{width:16px;height:16px}
.opt.on.site{background:var(--leaf);color:var(--leaf-ink)}
.opt.on.online{background:var(--sky);color:var(--sky-ink)}
.opt.on.main{background:var(--gold);color:var(--gold-ink)}
.opt.on.cell{background:var(--ink);color:var(--ground)}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:24px 8px;margin:0}

/* 현황, 명단 */
.page-h{display:flex;align-items:flex-end;gap:12px;margin:4px 0 12px}
.page-h > div{flex:1;min-width:0}
.page-h h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.page-h p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.addbtn{border:0;background:var(--leaf);color:var(--leaf-ink);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.addbtn svg{width:14px;height:14px}
.sync.off i{background:var(--gold,#C9A227);animation:none}
.prow.pend .who b::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold,#C9A227);margin-left:6px;vertical-align:middle}
.cellpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cellpick .btn small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.copybox{width:100%;box-sizing:border-box;border:0;background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;color:var(--ink)}
.month{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.month h3{margin:0;flex:1;font-size:15px;font-weight:600;text-align:center}
.mnav{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;padding:0}
.mnav:disabled{opacity:.35;cursor:default}
.mnav svg{width:17px;height:17px}
.avg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:12px 14px;margin:10px 0}
.avg b{font-size:30px;font-weight:300;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.avg span{font-size:13px;color:var(--ink-2)}
.mtx{overflow-x:auto;background:var(--surface);border-radius:14px;padding:6px}
.mtx table{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
.mtx th{font-size:11.5px;color:var(--ink-3);font-weight:500;text-align:center;padding:4px 2px;white-space:nowrap}
.mtx th.row{text-align:left;color:var(--ink);font-weight:500;font-size:12.5px;padding-right:6px}
.mtx td{text-align:center;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:500;min-width:36px}
.mtx td.fut{color:var(--ink-3);font-weight:400}
.mtx tr.total th,.mtx tr.total td{background:var(--surface-2);color:var(--ink)}
.plist{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 0;text-align:left;width:100%;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
.av.new{background:var(--gold-soft);color:var(--gold)}
.pinfo{min-width:0}
.pinfo b{display:block;font-size:15px;font-weight:500}
.pinfo small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pc{font-size:13px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{display:flex;gap:3px}
.strip i{width:6px;height:6px;border-radius:2px;background:var(--line)}
.strip i.on{background:var(--leaf)}
.strip i.f{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:var(--col);margin:0 auto;display:flex;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:11px;font-weight:500;color:var(--ink-3)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--leaf);font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:30;background:var(--ink);color:var(--ground);border-radius:12px;padding:10px 12px 10px 15px;font-size:13.5px;display:flex;align-items:center;gap:14px;width:max-content;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--b-site);font-size:13.5px;font-weight:600;white-space:nowrap;padding:2px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,var(--col));box-sizing:border-box;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .24s ease-out}
@keyframes up{from{transform:translate(-50%,32px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.sheet h3{margin:22px 0 8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.sheet p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.p-top{display:flex;gap:14px;align-items:center}
.av.lg{width:52px;height:52px;font-size:20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:18px 0 0}
.facts div{background:var(--surface-2);border-radius:12px;padding:9px 12px}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.phone{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:12px;padding:9px 10px 9px 12px;margin-top:6px}
.phone div{flex:1;min-width:0}
.phone span{display:block;font-size:12px;color:var(--ink-3)}
.phone b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all;white-space:nowrap}
.pbtn{flex:none;border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--leaf);text-decoration:none;line-height:1.3}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.field .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:0;background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;width:100%;box-sizing:border-box}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:inset 0 0 0 1.5px var(--leaf)}
.rolechips{display:flex;flex-wrap:wrap;gap:6px}
.rolechips .chip{background:var(--surface-2)}
.radios{display:flex;gap:8px}
.radios label{flex:1;position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:block;text-align:center;border-radius:999px;padding:9px;font-size:14.5px;background:var(--surface-2)}
.radios input:checked + span{background:var(--leaf);color:var(--leaf-ink);font-weight:600}
.radios input:focus-visible + span{outline:2px solid var(--leaf);outline-offset:2px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rec-row > span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-3)}
.pill.site{background:var(--leaf-soft);color:var(--leaf);font-weight:600}
.pill.online{background:var(--sky-soft);color:var(--sky);font-weight:600}
.pill.main{background:var(--gold-soft);color:var(--gold);font-weight:600}
.pill.cell{background:var(--ink);color:var(--ground);font-weight:600}
.actions{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;border-radius:999px;padding:12px;font-size:15px;font-weight:600;border:0;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-h h2{flex:1;text-align:center}
.cal-h .mnav{background:var(--surface-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--ink-3);padding:4px 0}
.cal .wd.sun,.cal .wd.fri{color:var(--leaf);font-weight:600}
.cal-d{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink-3);padding:0}
.cal-d.meet{background:var(--surface-2);color:var(--ink);font-weight:500}
.cal-d i{width:4px;height:4px;border-radius:50%;background:transparent}
.cal-d.rec i{background:var(--leaf)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-d.sel{background:var(--leaf);color:var(--leaf-ink)}
.cal-d.sel i{background:var(--leaf-ink)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-3);margin-top:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend em{display:inline-block;width:12px;height:12px;border-radius:50%;font-style:normal}
.quick{display:flex;gap:8px;margin-top:14px}
.homeicon{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 6px}
.homeicon svg{width:56px;height:56px}
.homeicon span{font-size:12.5px;color:var(--ink-2)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.steps b{color:var(--ink)}
.setlist{background:var(--surface-2);border-radius:14px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow > div{flex:1;min-width:0}
.setrow b{display:block;font-size:15px;font-weight:500}
.setrow small{display:block;font-size:12.5px;color:var(--ink-3)}
.setrow .mini{background:var(--surface)}
.linkbtn{border:0;background:none;padding:4px 0 0;color:var(--leaf);font-size:12.5px;font-weight:600}
.tg{flex:none;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;transition:background-color .2s}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card-ivory);transition:transform .2s}
.tg[aria-checked="true"]{background:var(--leaf)}
.tg[aria-checked="true"] i{transform:translateX(18px)}
.sheet .note{margin-top:10px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.sched{list-style:none;margin:0;padding:0;background:var(--surface-2);border-radius:14px;overflow:hidden}
.sched li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.sched li:last-child{border-bottom:0}
.sched time{color:var(--ink-3);font-variant-numeric:tabular-nums}
.field .chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14.5px;color:var(--ink);font-weight:400}
.chk input{width:18px;height:18px;accent-color:var(--leaf);margin:0}
.sheet .err-inline{min-height:18px;font-size:13px;color:var(--danger);margin-top:8px}

/* notification preview */
.push{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;width:min(calc(100% - 24px),420px);box-sizing:border-box;transform:translate(-50%,calc(-100% - 40px));transition:transform .4s cubic-bezier(.2,1,.3,1);display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:start;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.push.show{transform:translate(-50%,0)}
.push > svg{width:38px;height:38px}
.push .pa{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.push b{display:block;font-size:14.5px;font-weight:600;margin-top:1px}
.push .pb{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.4}

/* entry code gate: flat deep-green field */
.gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--deep);color:var(--deep-ink);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto}
.gate-in{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;text-align:center}
.gate-in svg{width:64px;height:64px}
.gate-in h2{margin:18px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.gate-in p{margin:6px 0 0;font-size:14px;color:var(--deep-2)}
.gate form{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:10px}
.gate label{font-size:13px;color:var(--deep-2);text-align:left}
.gate input{width:100%;box-sizing:border-box;border:0;background:var(--deep-fill);color:var(--deep-ink);border-radius:12px;padding:14px 16px;font-size:18px;letter-spacing:.08em;text-align:center;outline:none}
.gate input:focus{box-shadow:inset 0 0 0 1.5px var(--b-site)}
.gate input::placeholder{color:var(--deep-2);letter-spacing:0;font-size:15px}
.gate button{border:0;border-radius:999px;padding:14px;font-size:16px;font-weight:600;background:var(--deep-ink);color:var(--deep)}
.gate .err{min-height:20px;font-size:13px;color:var(--b-main);margin:0}
.gate.shake form{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* home: one screen, no scroll. Row = latest gathering card + this week's birthdays; 주요 일정 below. */
.hrow{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:8px;align-items:stretch}
.daycard{border:0;text-align:left;background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-width:0}
.daycard .c-tot{margin-top:8px;font-size:38px}
.daycard .c-bar{margin:9px 0}
.daycard .c-br{font-size:12px;gap:3px 6px}
.bdbox{position:relative;background:var(--surface);border-radius:16px;min-width:0;min-height:150px}
.bdbox-in{position:absolute;inset:0;overflow-y:auto;padding:12px 12px 8px;scrollbar-width:none}
.bdbox-in::-webkit-scrollbar{display:none}
.bdbox-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px}
.bdbox-h h3{margin:0;font-size:13px;font-weight:600}
.bdbox-h span{font-size:12px;color:var(--ink-3)}
.bdmini{list-style:none;margin:0;padding:0}
.bdm{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:baseline;gap:6px;width:100%;border:0;background:none;padding:4px 0;text-align:left;color:var(--ink)}
.bdm .bdcell{font-size:11.5px}
.bdm .bdname{font-size:13.5px}
.bdm .bddate{font-size:12px;color:var(--ink-3)}
.bdnone{margin:6px 0 0;font-size:12.5px;color:var(--ink-3)}
.home-h + .hrow{margin-top:0}
.hrow + .sec{margin-top:16px}
.nt-more{display:block;width:100%;border:0;background:none;padding:10px;font-size:13px;font-weight:500;color:var(--leaf)}
@media (max-width:350px){.w-a{width:42px}.w-m{width:46px}.w-c{width:40px;margin-left:4px}.opt{font-size:11.5px}.bdrow{grid-template-columns:80px minmax(0,1fr) auto}}
/* type: the Gowun pair. 고운돋움 (soft, rounded) for everything you read and tap;
   고운바탕 bold for titles and the big numbers, so headings feel printed and warm. */
:root{
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
.brand h1,.home-h h2,.wk .t b,.c-h b,.c-tot,.sec-t h3,.bdbox-h h3,.nd b,.entry-h h2,.page-h h2,.month h3,.ghead h3,
.sheet h2,.cal-h h2,.avg b,.gate-in h2,.homeicon span{font-family:var(--f-display);font-weight:700}
.brand h1{font-size:18px;letter-spacing:-.01em}
.home-h h2{font-size:22px;letter-spacing:-.02em}
.c-tot{font-weight:700;letter-spacing:-.03em}
.c-tot small{font-family:var(--f-ui);font-weight:400}
.daycard .c-tot{font-size:36px}
.c-h b{font-size:14px}
.nd b{font-size:19px}
.nd.up b{font-weight:700}
.avg b{font-size:28px}
.sec-t h3,.bdbox-h h3{letter-spacing:0}
.bdbox-h h3{font-size:14px}
/* 고운돋움 has one weight; keep emphasis by size and colour, and let the browser thicken only real headings */
.who b,.bdname,.pinfo b,.nt-title,.setrow b,.phone b,.facts dd{font-weight:400;letter-spacing:0}
.nt-title{font-size:15.5px;color:var(--ink)}
.who b,.pinfo b{font-size:15.5px}
.bdm .bdname{font-size:14px}
.btn,.cta,.addbtn,.opt,.chip,.pill-btn,.mini,.allbtn,.pbtn,.linkbtn,.nav button,.nav button[aria-current="page"],.dday,.bdcell,.pill.site,.pill.online,.pill.main,.pill.cell,.radios input:checked + span,.gate button,.toast button,.nt-more{font-weight:400}
.cta,.addbtn,.btn{font-size:15px}
.gate input{font-family:var(--f-ui)}
/* colour: lighter green. The attendance card, week board and entry screen become a pale sage field with dark green ink;
   the action green is a touch lighter. Dark mode keeps a deep field so it does not glare at night. */
/* one sage family: neutrals lean slightly green, the accent is a mid sage-forest, blue and gold are dusty so nothing shouts */
/* 11-25: warm ivory ground (사용자 요청 "아이보리, 녹색이랑 잘 어울리게"); cards are a near-white cream, the sage field stays green */
:root{
  --ground:#FAF7EE; --surface:#FFFDF8; --surface-2:#F2EEE2; --line:#E7E1D2;
  --ink:#1C2A21; --ink-2:#4F5A50; --ink-3:#6B7067;
  --leaf:#3B7D57; --leaf-ink:#FFFFFF; --leaf-soft:#E4EEDF;
  --sky:#4D72A6; --sky-ink:#FFFFFF; --sky-soft:#E7ECF2;
  --gold:#946B22; --gold-ink:#FFFFFF; --gold-soft:#F4EBD6;
  --deep:#E8F0E2; --deep-hi:#D6E6D5; --deep-lo:#DFEBDB;
  --card-ivory:#FFFDF8;
  --deep-ink:#1E3B2A; --deep-2:#4B6756; --deep-line:rgba(30,59,42,.12); --deep-fill:rgba(30,59,42,.05);
  --b-site:#3B7D57; --b-online:#6C8FC2; --b-main:#C9A052; --b-cell:#1E3B2A;
}
.bdcell{color:var(--ink-3)}
.gate{background:var(--ground)}
.daycard,.board{box-shadow:inset 0 0 0 1px var(--deep-line)}
/* mobile: iPhone zooms into any text field under 16px, so every field is 16px */
.search input,.field input,.field select,.field textarea{font-size:16px}
/* mobile: small controls keep their look but get a taller invisible tap area (aim ~44px) */
.opt,.chip,.allbtn,.pill-btn,.mini,.wbtn,.mnav,.linkbtn,.pbtn,.tg,.iconbtn{position:relative}
.opt::after,.chip::after,.allbtn::after,.pill-btn::after,.mini::after,.pbtn::after,.linkbtn::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.wbtn::after,.mnav::after,.iconbtn::after,.tg::after{content:"";position:absolute;inset:-6px}
.opt{height:36px}
.prow{padding:5px 0}
.bdm{padding:6px 0}
.iconbtn{width:40px;height:40px}
.nav button{min-height:52px}
/* main screen fits above the tab bar: notes show one line until opened */
.notices .nt:not(.open) .nt-body{-webkit-line-clamp:1}
.notices .nt-main{padding-block:10px}
.notices .nmeta{margin-top:4px}
.bdbox-in.more{-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --leaf:#7CCB9B; --leaf-soft:#1D3326;
  --deep:#183A28; --deep-hi:#214933; --deep-lo:#143323;
  --deep-ink:#EAF3EC; --deep-2:#9DBCA7; --deep-line:rgba(234,243,236,.14); --deep-fill:rgba(234,243,236,.06);
  --b-site:#86D3A2; --b-online:#A3BEF0; --b-main:#E6BC62; --b-cell:#EAF3EC;
}}
:root[data-theme="dark"]{
  --leaf:#7CCB9B; --leaf-soft:#1D3326;
  --deep:#183A28; --deep-hi:#214933; --deep-lo:#143323;
  --deep-ink:#EAF3EC; --deep-2:#9DBCA7; --deep-line:rgba(234,243,236,.14); --deep-fill:rgba(234,243,236,.06);
  --b-site:#86D3A2; --b-online:#A3BEF0; --b-main:#E6BC62; --b-cell:#EAF3EC;
}
.wk .now{color:var(--leaf)}
/* 출석 수정 권한 (11-26): 내 셀이 아닌 셀은 흐리게 */
.group.ro .opt{opacity:.38}
.group.ro .who{opacity:.75}
.ro-tag{flex:none;font-size:11.5px;color:var(--ink-3);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.ro-note{display:flex;align-items:center;gap:10px;margin:12px 0 0;background:var(--gold-soft);color:var(--ink-2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.ro-note span{flex:1}
.ro-note .mini{flex:none;background:var(--surface)}
/* 총무단 도구 (11-25) */
.devstats li{grid-template-columns:minmax(0,1fr) auto}
.devstats li span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.devstats li small{color:var(--ink-3);font-size:12px;margin-left:4px}
.devstats .zero{color:var(--ink-3)!important}
.devstats .tot span{font-weight:600}
.pn-count{align-self:flex-end;font-size:12px;color:var(--ink-3)}
.push-prev{display:flex;flex-direction:column;gap:2px;margin-top:12px;background:var(--surface-2);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.push-prev b{font-size:13px;color:var(--ink)}
.push-prev span{white-space:pre-wrap;word-break:break-word}
.btn.primary.danger{background:var(--danger);color:#fff}
/* 생명소식 (인스타, 11-25). 카드는 화면 폭 가득 (270px로 줄여 봤다가 사용자 요청으로 원래대로) */
.news-card .instagram-media{background:#fff!important;border:0!important;border-radius:14px!important;margin:0!important;max-width:100%!important;min-width:0!important;width:100%!important;box-shadow:none!important;padding:0!important}
.news-card iframe{border-radius:14px!important;max-width:100%!important;min-width:0!important}
.news-card blockquote > a{display:block;padding:18px;text-align:center;color:var(--leaf);text-decoration:none}
.news-act{display:flex;align-items:center;gap:8px;margin-top:8px}
.news-act.news-only{justify-content:flex-end}

<script>
(function(){
"use strict";
/* live mode: the installed app gets window.SERVER_URL (the Apps Script web app) from the build. Without it (claude.ai preview) the app shows fictional sample data. */
var LIVE_URL=(typeof window!=='undefined'&&typeof window.SERVER_URL==='string')?window.SERVER_URL:'';
function localToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* ---------- dates ---------- */
var TODAY=LIVE_URL?localToday():'2026-11-24', YEAR=2026, Y0='2026-01-01', Y1='2027-10-31';
var DOW='일월화수목금토';
function pad(n){return String(n).padStart(2,'0')}
function key(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function toD(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function fromD(d){return key(d.getFullYear(),d.getMonth()+1,d.getDate())}
function addDays(k,n){var d=toD(k);d.setDate(d.getDate()+n);return fromD(d)}
function dowIdx(k){return toD(k).getDay()}
function weekStart(k){return addDays(k,-dowIdx(k))}           /* Sunday-first weeks, like the sheet */
function monthDays(ym){var a=ym.split('-').map(Number),n=new Date(a[0],a[1],0).getDate(),r=[];for(var i=1;i<=n;i++)r.push(key(a[0],a[1],i));return r}
function meetDays(ym){return monthDays(ym).filter(function(k){var g=dowIdx(k);return g===0||g===5})}
function shiftMonth(ym,n){var a=ym.split('-').map(Number);var d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function mLabel(ym){var a=ym.split('-').map(Number);return a[0]+'년 '+a[1]+'월'}
function md(k){var a=k.split('-').map(Number);return a[1]+'월 '+a[2]+'일'}
function sd(k){var a=k.split('-').map(Number);return a[1]+'/'+a[2]}
function inYear(k){return k>=Y0&&k<=Y1}

/* ---------- gatherings ----------
   주일예배: one of 5부 현장 / 5부 온라인 / 대예배, plus 셀모임 yes/no
   금요철야: 현장 or 온라인.  Any other day picked from the calendar: 특별 모임, 현장 or 온라인 */
function kindOf(k){var g=dowIdx(k);return g===0?'sun':g===5?'fri':'etc'}
var KIND={sun:'주일예배',fri:'금요철야',etc:'특별 모임'};
var SVC_LABEL={site:'현장',online:'온라인',main:'대예배'};
function svcText(kind,v){if(!v)return '';if(kind==='sun')return v==='main'?'대예배':'5부 '+SVC_LABEL[v];return SVC_LABEL[v]}

/* ---------- sample people (fictional) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(51117);
var SUR='김이박최정강조윤장임한오서신권황안송류홍문백남유노'.split('');
var GIV=['하늘','서윤','지안','도윤','예린','시우','하람','은솔','주원','다온','가온','서진','이안','로아','유찬','세아','태오','나린','소망','은총','예준','수아','아름','한결','새벽','빛나','온유','기쁨','사랑','요셉','한나','은혜','믿음','주하','다인','윤슬','하준','시온','예담','라엘','선우','채아','도현','이레','하엘','다빈','루아','여름','지유','건우','하린','에스더','다니엘','바울','마리','주안','예솔','새롬'];
var used={};
function pickName(){var n;do{n=SUR[Math.floor(R()*SUR.length)]+GIV[Math.floor(R()*GIV.length)]}while(used[n]);used[n]=1;return n}
var GROUPS=[{id:'staff',name:'총무단, 새가족'}];
for(var gi=1;gi<=6;gi++)GROUPS.push({id:'c'+gi,name:gi+'셀'});
var PRAYERS=['취업 준비 중, 면접을 위해','어머니 건강 회복','새 직장 적응','졸업 논문 마무리','가족 구원','이사 준비','입대 앞두고 마음 준비','시험 기간 체력'];
var M=[],uid=0;
function person(g,role,o){o=o||{};var y=1997+Math.floor(R()*8),mo=1+Math.floor(R()*12),d=1+Math.floor(R()*28);
  var p={id:'m'+(++uid),name:pickName(),group:g==='new'?'staff':g,role:role||'',gender:R()<.55?'여':'남',birth:y+'. '+mo+'. '+d,
    gen:g==='new'?'':String(22+Math.floor(R()*8)),phone:'010-0000-'+String(1000+Math.floor(R()*9000)),
    note:o.note!=null?o.note:(R()<.3?PRAYERS[Math.floor(R()*PRAYERS.length)]:''),p:o.p!=null?o.p:(.4+R()*.55),mainBias:R()<.25};
  M.push(p);return p}
if(!LIVE_URL){['선임총무','서기','새가족총무','새가족부총무','회계'].forEach(function(r){person('staff',r,{p:.95})});
['지난주 처음 오심','청소년부에서 올라옴','친구 초대로 방문','이전 교회에서 옮겨 오심'].forEach(function(n){person('new','새가족',{note:n,p:.6})});
[16,15,15,15,14,15].forEach(function(n,i){var g='c'+(i+1);for(var k=0;k<n;k++){
  var role=k===0?'셀리더':k===1?'부셀리더':(R()<.28?'봉사자':'');
  person(g,role,{p:k<2?.93:(R()<.13?.05:undefined)});}
  gOf(g).leader=M.filter(function(m){return m.group===g})[0].name;});
/* sample birthdays in the current week so the 이번 주 생일 section has something to show */
[[7,'2001. 11. 24'],[23,'1999. 11. 26'],[12,'2002. 11. 23'],[51,'2003. 11. 28'],[66,'2000. 11. 22']].forEach(function(x){if(M[x[0]])M[x[0]].birth=x[1]});}
var ROLES=['셀리더','부셀리더','봉사자'];
function syncLeaders(){GROUPS.forEach(function(g){if(g.id.charAt(0)!=='c')return;g.leader=M.filter(function(m){return m.group===g.id&&m.role==='셀리더'}).map(function(m){return m.name}).join(', ')})}
/* list order inside a group: 셀리더 and 총무단 roles, then 부셀리더 stay on top; everyone else keeps arrival order (ord), so people added or moved in go to the bottom */
var ordSeq=0;function numberAll(){M.forEach(function(m){if(m.ord==null)m.ord=++ordSeq})}
function nextOrd(){numberAll();return ++ordSeq}
function rankOf(m){var r=m.role||'';if(/부셀리더/.test(r))return 1;if(/셀리더|총무|회계|서기/.test(r))return 0;return 2}
function orderMembers(list){numberAll();
  var gi=function(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].id===id)return i;return 99};
  return list.slice().sort(function(a,b){return gi(a.group)-gi(b.group)||rankOf(a)-rankOf(b)||a.ord-b.ord})}
function byId(id){for(var i=0;i<M.length;i++)if(M[i].id===id)return M[i]}
function gOf(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].id===id)return GROUPS[i]}

/* ---------- store: A[date][memberId] = {svc:'site'|'online'|'main', cell:true} ---------- */
var A={};
function rec(d,id){return (A[d]&&A[d][id])||{}}
function put(d,id,patch,fromServer){A[d]=A[d]||{};var r=A[d][id]||{};for(var k in patch){if(patch[k])r[k]=patch[k];else delete r[k]}
  if(Object.keys(r).length)A[d][id]=r;else delete A[d][id];
  if(LIVE_URL&&!fromServer){var op={a:'mark',date:d,name:id};if('svc' in patch)op.svc=patch.svc||null;if('cell' in patch)op.cell=!!patch.cell;liveQueue(op)}}
function hasRec(d){return !!(A[d]&&Object.keys(A[d]).length)}
function attended(d,id){var r=rec(d,id);return !!(r.svc||r.cell)}
if(!LIVE_URL)(function seed(){
  for(var mo=1;mo<=12;mo++){meetDays(YEAR+'-'+pad(mo)).forEach(function(d){
    if(d>TODAY)return;var kind=kindOf(d);
    M.forEach(function(m){var r=R(),r2=R();
      if(kind==='sun'){var svc=null;if(r<m.p*.92)svc=r2<.09?'online':(m.mainBias?(r2<.75?'main':'site'):(r2<.2?'main':'site'));
        var cell=svc?R()<.84:R()<.08;put(d,m.id,{svc:svc,cell:cell})}
      else if(r<m.p*.5)put(d,m.id,{svc:r2<.18?'online':'site'});
    });
  })}
  M.forEach(function(m){if(R()<m.p*.6)put('2026-10-03',m.id,{svc:'site'})});
})();

/* ---------- state ---------- */
function lastMeetingOnOrBefore(k){var d=k;for(var i=0;i<8;i++){if(kindOf(d)!=='etc')return d;d=addDays(d,-1)}return k}
/* 출석 탭을 열면 먼저 보여줄 모임 (11-25 사용자 요청):
   수요일 ~ 토요일 오전 → 그 주 금요철야, 토요일 낮 12시 ~ 화요일 → 그 사이 주일예배 */
function focusMeeting(){var g=dowIdx(TODAY),h=new Date().getHours();
  if(g>=3&&g<=5||(g===6&&h<12))return addDays(weekStart(TODAY),5);
  return g===6?addDays(TODAY,1):addDays(TODAY,-g)}
var S={tab:'home',date:lastMeetingOnOrBefore(TODAY),group:'all',q:'',rg:'all',rq:'',smeasure:'sunTotal'};
S.month=S.date.slice(0,7);

var main=document.getElementById('main');
function $(s,r){return (r||document).querySelector(s)}
function withRo(w){var c=w.charCodeAt(w.length-1)-0xAC00;if(c<0||c>11171)return w+'로';var jong=c%28;return w+(jong===0||jong===8?'로':'으로')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- icons ---------- */
var ICON={
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  check:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>',
  mark:'<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path class="st" d="M20 38V19"/><path d="M20 22.5c0-6-4-9.5-10-9 0 5.8 3.8 9 10 9z"/><path d="M20 19c0-6 3.6-9.8 10-9.2 0 6-3.8 9.2-10 9.2z"/></svg>'
};

/* ---------- totals ---------- */
function sumDay(d,gid){var o={site:0,online:0,main:0,cell:0,total:0};
  M.forEach(function(m){if(gid&&m.group!==gid)return;var r=rec(d,m.id);if(r.svc){o[r.svc]++;o.total++}if(r.cell)o.cell++});return o}

/* ---------- week board ---------- */
function weekDays(){
  var ws=weekStart(S.date),out=[];
  for(var i=0;i<7;i++){var d=addDays(ws,i);if(!inYear(d))continue;var k=kindOf(d);if(k!=='etc'||d===S.date||hasRec(d))out.push(d)}
  return out;
}
function boardHTML(){
  var ws=weekStart(S.date),we=addDays(ws,6),wa=ws.split('-').map(Number);
  var ORD=['첫째','둘째','셋째','넷째','다섯째'];
  function dotD(k){var a=k.split('-').map(Number);return a[1]+'.'+pad(a[2])}
  var title=wa[1]+'월 '+ORD[Math.ceil(wa[2]/7)-1]+' 주';
  var thisWeek=weekStart(TODAY)===ws,N=M.length;
  var prevOk=addDays(ws,-1)>=Y0,nextOk=addDays(ws,7)<=Y1;
  var cols=weekDays().map(function(d){var k=kindOf(d),s=sumDay(d),future=d>TODAY&&!hasRec(d);
    function seg(c,v){return v?'<i class="'+c+'" style="width:'+(v/N*100).toFixed(1)+'%"></i>':''}
    function row(c,l,v){return '<dt><span class="dot '+c+'"></span>'+l+'</dt><dd>'+v+'</dd>'}
    var bar,br;
    if(k==='sun'){bar=seg('k-site',s.site)+seg('k-online',s.online)+seg('k-main',s.main);
      br=row('k-site','5부 현장',s.site)+row('k-online','5부 온라인',s.online)+row('k-main','대예배',s.main)+'<span class="sep"></span>'+row('k-cell','셀모임',s.cell)}
    else{bar=seg('k-site',s.site)+seg('k-online',s.online);br=row('k-site','현장',s.site)+row('k-online','온라인',s.online)}
    return '<button type="button" class="dcol" data-date="'+d+'" aria-pressed="'+(d===S.date)+'" aria-label="'+md(d)+' '+KIND[k]+' '+s.total+'명"><span class="c-h"><b>'+KIND[k]+'</b><em>'+dotD(d)+' '+DOW[dowIdx(d)]+'</em></span>'+
      '<span class="c-tot">'+s.total+'<small>명</small></span><span class="c-bar" aria-hidden="true">'+bar+'</span><dl class="c-br">'+br+'</dl>'+(future?'<span class="c-note">아직 기록 전이에요</span>':'')+'</button>'});
  var mark='<svg class="mark" viewBox="0 0 120 140" aria-hidden="true"><path d="M70 140C70 112 66 90 72 64"/><path d="M71 88C58 71 40 66 22 72C34 88 52 93 71 88Z"/><path d="M71 88C56 82 40 77 22 72"/><path d="M72 64C78 42 96 30 118 32C112 54 94 66 72 64Z"/><path d="M72 64C88 52 102 42 118 32"/></svg>';
  return '<section class="board" aria-label="이번 주 출석 종합">'+mark+
    '<div class="wk"><button type="button" class="wbtn" data-week="-1" aria-label="이전 주"'+(prevOk?'':' disabled')+'>'+ICON.prev+'</button>'+
    '<div class="t"><span class="eyebrow">'+title+(thisWeek?'<span class="now">이번 주</span>':'')+'</span><b>'+dotD(ws)+' – '+dotD(we)+'</b></div>'+
    '<button type="button" class="wbtn" data-week="1" aria-label="다음 주"'+(nextOk?'':' disabled')+'>'+ICON.next+'</button>'+

function chipHTML(sel,attr){
  return '<button type="button" class="chip" data-'+attr+'="all" aria-pressed="'+(sel==='all')+'">전체</button>'+
    GROUPS.map(function(g){return '<button type="button" class="chip" data-'+attr+'="'+g.id+'" aria-pressed="'+(sel===g.id)+'">'+g.name+'</button>'}).join('');
}
function headerCtl(kind){
  if(kind==='sun')return '<div class="ctlh"><span class="grp" style="width:100px"><span>5부예배</span><i></i></span><span class="w-m">대예배</span><span class="w-c">셀모임</span></div>';
  return '<div class="ctlh"><span class="w-f">현장</span><span class="w-f">온라인</span></div>';
}
function rowCtl(m,kind){
  var r=rec(S.date,m.id);
  function b(cls,val,label,w){var on=r.svc===val;return '<button type="button" class="opt '+cls+' '+w+(on?' on':'')+'" data-svc="'+val+'" data-id="'+m.id+'" aria-pressed="'+on+'">'+label+'</button>'}
  if(kind==='sun')return '<div class="ctl" role="group" aria-label="'+m.name+' 주일예배">'+b('site','site','현장','w-a')+b('online','online','온라인','w-a')+b('main','main','대예배','w-m')+
    '<button type="button" class="opt cell w-c'+(r.cell?' on':'')+'" data-cell data-id="'+m.id+'" aria-pressed="'+!!r.cell+'" aria-label="'+m.name+' 셀모임">'+ICON.check+'</button></div>';
  return '<div class="ctl" role="group" aria-label="'+m.name+' '+KIND[kind]+'">'+b('site','site','현장','w-f')+b('online','online','온라인','w-f')+'</div>';
}
function rowHTML(m,kind){
  return '<div class="prow" data-row="'+m.id+'"><button type="button" class="who" data-person="'+m.id+'"><b>'+m.name+'</b><small>'+(m.role||'&nbsp;')+'</small></button>'+rowCtl(m,kind)+'</div>';
}
function renderCheck(){
  var kind=kindOf(S.date);
  main.innerHTML=boardHTML()+
    '<div class="entry-h"><h2>'+md(S.date)+' '+KIND[kind]+'</h2><p>'+(S.date>TODAY?'미리 기록':S.date===TODAY?'오늘':'')+'</p></div>'+
    '<p style="margin:2px 0 0;font-size:12.5px;color:var(--ink-3)">'+(kind==='sun'?'예배는 셋 중 하나를 고르고, 셀모임은 따로 체크해요. 같은 버튼을 다시 누르면 지워져요.':'현장이나 온라인을 눌러 기록해요. 같은 버튼을 다시 누르면 지워져요.')+'</p>'+
    (LIVE_URL&&!S.admin&&!myCell()?'<div class="ro-note"><span>지금은 보기만 할 수 있어요. 내 셀을 고르면 그 셀을 체크할 수 있어요.</span><button type="button" class="mini" data-mycell-open>내 셀 고르기</button></div>':'')+
    '<div class="search">'+ICON.search+'<input id="q" type="search" placeholder="이름 찾기" value="'+esc(S.q)+'" autocomplete="off" aria-label="이름 찾기"></div>'+
    '<div class="chips scrollx">'+chipHTML(S.group,'g')+'</div>'+
    '<div class="colhead"><span class="nmh">이름</span>'+headerCtl(kind)+'</div>'+
    '<div id="groups"></div>';
  renderGroups();
}
/* 출석·셀원 정보(역할, 기도제목·메모) 수정 권한 (11-26 사용자 결정): 총무단 모드 = 모든 셀, 리더 = 내 셀만, 내 셀을 안 고르면 보기만.
   "내 셀"은 🔔에서 바꿀 수 있어서 실수로 남의 셀을 누르는 걸 막는 용도예요(서버는 막지 않음). 미리보기는 다 열어 둠. */
function canEdit(gid){if(!LIVE_URL||S.admin)return true;var mc=myCell();return !!mc&&mc===gid}
function roMsg(){return myCell()?'다른 셀은 보기만 할 수 있어요. 대신 체크가 필요하면 총무단에 말해 주세요':'내 셀을 고르면 체크할 수 있어요. 출석 탭 위의 “내 셀 고르기”를 눌러 주세요'}
function groupMembers(gid){return orderMembers(M.filter(function(m){return m.group===gid&&(!S.q||m.name.indexOf(S.q)>-1)}))}
function renderGroups(){
  var box=$('#groups');if(!box)return;var kind=kindOf(S.date),html='';
  GROUPS.forEach(function(g){if(S.group!=='all'&&g.id!==S.group)return;
    var ms=groupMembers(g.id);if(!ms.length)return;
    var ed=canEdit(g.id);
    html+='<section class="group'+(ed?'':' ro')+'" data-gsec="'+g.id+'"><div class="ghead"><h3>'+g.name+(g.leader?'<span>'+g.leader+'</span>':'')+'</h3><span class="gcount"></span>'+(ed?(kind==='sun'?'<button type="button" class="allbtn" data-allcell="'+g.id+'"></button>':''):'<span class="ro-tag">보기만</span>')+'</div>'+ms.map(function(m){return rowHTML(m,kind)}).join('')+'</section>'});
  box.innerHTML=html||'<p class="empty">‘'+esc(S.q)+'’ 이름을 찾지 못했어요. 명단 탭에서 새로 추가할 수 있어요.</p>';
  updateHeads();
}
function updateHeads(){
  var kind=kindOf(S.date);
  Array.prototype.forEach.call(main.querySelectorAll('[data-gsec]'),function(sec){
    var ms=groupMembers(sec.getAttribute('data-gsec'));var w=0,c=0;ms.forEach(function(m){var r=rec(S.date,m.id);if(r.svc)w++;if(r.cell)c++});
    $('.gcount',sec).textContent=kind==='sun'?'예배 '+w+', 셀 '+c+' / '+ms.length+'명':w+' / '+ms.length+'명';
    var ab=$('.allbtn',sec);if(ab)ab.textContent=c===ms.length?'셀모임 해제':'셀모임 전원';
  });
}
function updateRow(id,remote){
  var row=main.querySelector('.prow[data-row="'+id+'"]');if(!row)return;var m=byId(id);
  $('.ctl',row).outerHTML=rowCtl(m,kindOf(S.date));
  if(remote){void row.offsetWidth;row.classList.add('remote');setTimeout(function(){row.classList.remove('remote')},1900)}
}
function afterChange(){updateHeads();refreshBoard()}

/* ---------- stats tab ---------- */
var MEASURES=[
  {k:'sunTotal',label:'주일예배',kind:'sun',f:function(r){return !!r.svc}},
  {k:'site',label:'5부 현장',kind:'sun',f:function(r){return r.svc==='site'}},
  {k:'online',label:'5부 온라인',kind:'sun',f:function(r){return r.svc==='online'}},
  {k:'main',label:'대예배',kind:'sun',f:function(r){return r.svc==='main'}},
  {k:'cell',label:'셀모임',kind:'sun',f:function(r){return !!r.cell}},
  {k:'friTotal',label:'금요철야',kind:'fri',f:function(r){return !!r.svc}},
  {k:'friSite',label:'금요 현장',kind:'fri',f:function(r){return r.svc==='site'}},
  {k:'friOnline',label:'금요 온라인',kind:'fri',f:function(r){return r.svc==='online'}}
];
function renderStats(){
  var ms=MEASURES.filter(function(x){return x.k===S.smeasure})[0];
  var ds=meetDays(S.month).filter(function(d){return kindOf(d)===ms.kind});
  var past=ds.filter(function(d){return d<=TODAY});
  function cnt(d,gid){return M.filter(function(m){return(gid==null||m.group===gid)&&ms.f(rec(d,m.id))}).length}
  var avg=past.length?Math.round(past.reduce(function(a,d){return a+cnt(d)},0)/past.length):0;
  var rows=GROUPS.map(function(g){var size=M.filter(function(m){return m.group===g.id}).length;
    return '<tr><th class="row" scope="row">'+g.name+'</th>'+ds.map(function(d){if(d>TODAY)return '<td class="fut">–</td>';var c=cnt(d,g.id),r=size?c/size:0;
      return '<td style="background:color-mix(in srgb,var(--leaf) '+Math.round(r*88)+'%,var(--surface-2));color:'+(r>.5?'var(--leaf-ink)':'var(--ink)')+'">'+c+'</td>'}).join('')+'</tr>'}).join('');
  var total='<tr class="total"><th class="row" scope="row">합계</th>'+ds.map(function(d){return d>TODAY?'<td class="fut">–</td>':'<td>'+cnt(d)+'</td>'}).join('')+'</tr>';
  main.innerHTML=
    '<div class="page-h"><div><h2>현황</h2><p>출석부 시트 월별 탭 맨 위 합계와 같은 숫자예요.</p></div></div>'+
    '<div class="month"><button type="button" class="mnav" data-mnav="-1" aria-label="이전 달"'+(S.month<=Y0.slice(0,7)?' disabled':'')+'>'+ICON.prev+'</button><h3>'+mLabel(S.month)+'</h3><button type="button" class="mnav" data-mnav="1" aria-label="다음 달"'+(S.month>=Y1.slice(0,7)?' disabled':'')+'>'+ICON.next+'</button></div>'+
    '<div class="chips scrollx">'+MEASURES.map(function(x){return '<button type="button" class="chip" data-measure="'+x.k+'" aria-pressed="'+(x.k===ms.k)+'">'+x.label+'</button>'}).join('')+'</div>'+
    '<div class="avg"><b>'+(past.length?avg:'–')+'</b><span>'+(past.length?'명, '+Number(S.month.slice(5))+'월 '+ms.label+' 평균 ('+past.length+'번)':'이 달은 아직 기록이 없어요')+'</span></div>'+
    '<div class="mtx"><table><thead><tr><th class="row" scope="col">구분</th>'+ds.map(function(d){return '<th scope="col">'+sd(d)+'</th>'}).join('')+'</tr></thead><tbody>'+rows+total+'</tbody></table></div>';
}

/* ---------- roster tab ---------- */
function monthCount(m,ym){var c=0;monthDays(ym).forEach(function(d){var r=rec(d,m.id);if(r.svc)c++;if(r.cell)c++});return c}
function renderRoster(){
  main.innerHTML='<div class="page-h"><div><h2>명단</h2><p>'+M.length+'명</p></div><button type="button" class="addbtn" data-add>'+(S.admin?'':ICON.lock)+'새 사람 추가</button></div>'+
    '<div class="search" style="margin-top:0">'+ICON.search+'<input id="rq" type="search" placeholder="이름 찾기" value="'+esc(S.rq)+'" autocomplete="off" aria-label="이름 찾기"></div>'+
    '<div class="chips scrollx">'+chipHTML(S.rg,'rg')+'</div><div class="plist" id="plist" style="margin-top:6px"></div>';
  renderPlist();
}
/* 소속·역할 한 줄 (11-25): "총무단, 새가족" 그룹은 총무단인지 새가족인지 먼저 보이게 → "새가족", "총무단 · 선임총무", "3셀 · 셀리더" */
function whoLabel(m){
  if(m.group==='staff'){var nf=m.role==='새가족'||m.section==='새가족';return nf?'새가족':'총무단'+(m.role&&m.role!=='총무단'?' · '+m.role:'')}
  var g=gOf(m.group);return (g?g.name:'')+(m.role?' · '+m.role:'');
}
function renderPlist(){
  var box=$('#plist');if(!box)return;
  var list=orderMembers(M.filter(function(m){return(S.rg==='all'||m.group===S.rg)&&(!S.rq||m.name.indexOf(S.rq)>-1)}));
  box.innerHTML=list.length?list.map(function(m){var g=gOf(m.group);
    return '<button type="button" class="person" data-person="'+m.id+'"><span class="av'+(m.role==='새가족'?' new':'')+'">'+m.name.charAt(0)+'</span><span class="pinfo"><b>'+m.name+'</b><small>'+esc(whoLabel(m))+(m.gen?' · '+m.gen+'기':'')+'</small></span></button>'}).join('')   /* 11-25: 이번 달 횟수·점 표시는 사용자 요청으로 뺌 */
    :'<p class="empty">찾는 이름이 없어요. 오른쪽 위 ‘새 사람 추가’로 등록할 수 있어요.</p>';
}

/* ---------- sheets ---------- */
var scrim=$('#scrim'),sheet=$('#sheet');
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;sheet.hidden=false;scrim.hidden=false}
function closeSheet(){sheet.hidden=true;scrim.hidden=true;sheet.innerHTML=''}
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

function openPerson(id){
  var m=byId(id),g=gOf(m.group),ed=canEdit(m.group),ym=S.tab==='stats'?S.month:S.date.slice(0,7);
  var ds=monthDays(ym).filter(function(d){return d<=TODAY&&(kindOf(d)!=='etc'||hasRec(d))});
  var rows=ds.map(function(d){var k=kindOf(d),r=rec(d,m.id),p='';
      if(k==='sun'){p+=r.svc?'<span class="pill '+r.svc+'">'+svcText('sun',r.svc)+'</span>':'<span class="pill">예배 없음</span>';p+=r.cell?'<span class="pill cell">셀모임</span>':''}
      else p=r.svc?'<span class="pill '+r.svc+'">'+KIND[k]+' '+SVC_LABEL[r.svc]+'</span>':'<span class="pill">'+KIND[k]+' 없음</span>';
      return '<div class="rec-row"><span>'+sd(d)+' '+DOW[dowIdx(d)]+'</span><div class="pills">'+p+'</div></div>'}).join('');
  openSheet('<div class="p-top"><span class="av lg'+(m.role==='새가족'?' new':'')+'">'+m.name.charAt(0)+'</span><div><h2>'+m.name+'</h2><p>'+esc(whoLabel(m))+'</p></div></div>'+
    '<dl class="facts"><div><dt>성별</dt><dd>'+m.gender+'</dd></div><div><dt>기수</dt><dd>'+(m.gen?m.gen+'기':'미정')+'</dd></div><div><dt>생년월일</dt><dd>'+esc(m.birth||'미입력')+'</dd></div></dl>'+
    (function(){var p=m.phone||'',dg=p.replace(/[^0-9]/g,'');
      return '<div class="phone"><div><span>연락처</span><b>'+(p?esc(p):'미입력')+'</b></div>'+(p?'<a class="pbtn" href="tel:'+dg+'">전화</a><a class="pbtn" href="sms:'+dg+'">문자</a><button type="button" class="pbtn" data-copy="'+esc(p)+'">복사</button>':'')+'</div>'})()+
    '<div class="field"><label for="grp-'+m.id+'">소속 셀'+(S.admin?'':' <button type="button" class="linkbtn" data-unlock="'+m.id+'">총무단 코드로 바꾸기</button>')+'</label><select id="grp-'+m.id+'"'+(S.admin?'':' disabled')+'>'+GROUPS.map(function(x){return '<option value="'+x.id+'"'+(x.id===m.group?' selected':'')+'>'+x.name+(x.leader?' ('+x.leader+')':'')+'</option>'}).join('')+'</select></div>'+
    '<p style="font-size:12.5px;color:var(--ink-3);margin-top:6px">'+(S.admin?'셀을 바꾸면 새 셀 명단 맨 아래로 가고, 지금까지의 출석 기록은 그대로 따라가요.':'셀 이동은 총무단만 할 수 있어요.')+'</p>'+
    (ed?'':'<p class="ro-note" style="margin-top:14px"><span>'+(myCell()?'다른 셀 사람이라 보기만 할 수 있어요. 역할·메모 수정은 그 셀 리더나 총무단이 해요.':'내 셀을 고르면 우리 셀 사람의 역할·메모를 고칠 수 있어요.')+'</span></p>')+
    '<div class="field"><label for="role-'+m.id+'">역할</label><input id="role-'+m.id+'" list="role-list" value="'+esc(m.role)+'" placeholder="'+(ed?'비워두면 셀원':'셀원')+'" autocomplete="off"'+(ed?'':' readonly')+'>'+
    (ed?'<div class="rolechips">'+ROLES.map(function(r){return '<button type="button" class="chip" data-role="'+r+'" data-for="role-'+m.id+'">'+r+'</button>'}).join('')+'</div>':'')+
    '<datalist id="role-list">'+ROLES.concat(['선임총무','서기','새가족총무','새가족부총무','회계']).map(function(r){return '<option value="'+r+'">'}).join('')+'</datalist></div>'+
    '<div class="field"><label for="note-'+m.id+'">기도제목, 메모</label><textarea id="note-'+m.id+'" placeholder="'+(ed?'함께 기도할 내용이나 메모를 적어주세요':'')+'"'+(ed?'':' readonly')+'>'+esc(m.note)+'</textarea></div>'+
    '<h3>'+Number(ym.slice(5))+'월 기록, '+monthCount(m,ym)+'회</h3><div class="rec">'+(rows||'<p>이 달에는 아직 기록이 없어요.</p>')+'</div>'+
    '<div class="actions"><button type="button" class="btn'+(ed?'':' primary')+'" data-close>닫기</button>'+(ed?'<button type="button" class="btn primary" data-save="'+m.id+'">저장</button>':'')+'</div>');
}
/* 새 사람 추가의 역할 칸 (11-25): 셀이면 셀리더·부셀리더·봉사자(비우면 셀원), "총무단, 새가족"이면 새가족으로 고정
   (앱에서 추가한 사람은 명단의 새가족 시트로 들어가요. 총무단은 명단 시트에서 직접) */
function addRoleHTML(g){
  if(g==='staff')return '<label for="add-role">역할</label><input id="add-role" value="새가족" disabled><p style="font-size:12.5px;color:var(--ink-3);margin:2px 0 0">새가족으로 추가돼요. 총무단은 명단 시트에서 직접 추가해 주세요.</p>';
  return '<label for="add-role">역할</label><input id="add-role" placeholder="비워두면 셀원" autocomplete="off">'+
    '<div class="rolechips">'+ROLES.map(function(r){return '<button type="button" class="chip" data-role="'+r+'" data-for="add-role">'+r+'</button>'}).join('')+'</div>';
}
sheet.addEventListener('change',function(e){if(e.target.id==='add-group'){var f=$('#add-role-f');if(f)f.innerHTML=addRoleHTML(e.target.value)}});
function openAdd(){
  openSheet('<h2>새 사람 추가</h2><p>추가하면 시트의 해당 셀 명단 맨 아래에 한 줄이 생겨요.</p>'+
    '<form id="addform" autocomplete="off">'+
    '<div class="field"><label for="add-name">이름</label><input id="add-name" required maxlength="10" placeholder="예: 김하늘"></div>'+
    '<div class="field"><label for="add-group">소속</label><select id="add-group">'+GROUPS.map(function(g){return '<option value="'+g.id+'"'+(g.id==='staff'?' selected':'')+'>'+g.name+(g.leader?' ('+g.leader+')':'')+'</option>'}).join('')+'</select></div>'+
    '<div class="field" id="add-role-f">'+addRoleHTML('staff')+'</div>'+
    '<div class="field"><span class="lbl" id="add-gender-l">성별</span><div class="radios" role="radiogroup" aria-labelledby="add-gender-l"><label><input type="radio" name="add-gender" id="add-gender-f" value="여" checked><span>여</span></label><label><input type="radio" name="add-gender" id="add-gender-m" value="남"><span>남</span></label></div></div>'+
    '<div class="row2"><div class="field"><label for="add-birth">생년월일</label><input id="add-birth" placeholder="2003. 4. 12"></div><div class="field"><label for="add-gen">기수</label><input id="add-gen" inputmode="numeric" placeholder="28"></div></div>'+
    '<div class="field"><label for="add-phone">연락처</label><input id="add-phone" type="tel" inputmode="tel" placeholder="010-0000-0000"></div>'+
    '<div class="field"><label for="add-note">메모</label><input id="add-note" placeholder="예: 친구 초대로 방문"></div>'+
    '<div class="actions"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">추가하기</button></div></form>');
  setTimeout(function(){var i=$('#add-name');i&&i.focus()},50);
}
function calHTML(){
  var ym=S.calMonth,a=ym.split('-').map(Number),first=new Date(a[0],a[1]-1,1).getDay();
  var cells='';['일','월','화','수','목','금','토'].forEach(function(w,i){cells+='<span class="wd'+(i===0?' sun':i===5?' fri':'')+'">'+w+'</span>'});
  for(var b=0;b<first;b++)cells+='<span></span>';
  monthDays(ym).forEach(function(d){var k=kindOf(d),meet=k!=='etc';
    cells+='<button type="button" class="cal-d'+(meet?' meet':'')+(hasRec(d)?' rec':'')+(d===TODAY?' today':'')+(d===S.date?' sel':'')+'" data-pick="'+d+'" aria-label="'+md(d)+' '+(meet?KIND[k]:DOW[dowIdx(d)]+'요일')+'">'+Number(d.slice(8))+'<i></i></button>'});

  var name=$('#add-name').value.trim();if(!name){$('#add-name').focus();return}
  var g=$('#add-group').value,gender=(sheet.querySelector('input[name="add-gender"]:checked')||{}).value||'여';
  if(LIVE_URL&&byId(name)){toast(name+' 님은 이미 명단에 있어요');return}
  var role=g==='staff'?'새가족':(($('#add-role')||{}).value||'').trim();if(role==='셀원')role='';
  if(LIVE_URL)liveQueue({a:'add',name:name,group:g,role:role,gender:gender,birth:$('#add-birth').value.trim(),phone:$('#add-phone').value.trim(),gen:$('#add-gen').value.trim(),note:$('#add-note').value.trim(),admin:adminCode()});
  var o0=nextOrd();uid++;M.push({id:LIVE_URL?name:'m'+uid,ord:o0,name:name,group:g,role:role,gender:gender,birth:$('#add-birth').value.trim(),phone:$('#add-phone').value.trim(),gen:$('#add-gen').value.trim(),note:$('#add-note').value.trim(),p:.5});
  closeSheet();toast(name+' 님을 '+gOf(g).name+'에 추가했어요');render();
});

/* ---------- toast ---------- */
var toastT=null,lastOwn=0;
function toast(msg,undo){var t=$('#toast');t.innerHTML='<span>'+msg+'</span>'+(undo?'<button type="button" id="undo">되돌리기</button>':'');
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},3400);
  if(undo){$('#undo').addEventListener('click',function(){undo();t.classList.remove('show')})}}

/* ---------- interactions ---------- */
main.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||t.disabled)return;
  if((t.hasAttribute('data-svc')||t.hasAttribute('data-cell')||t.hasAttribute('data-allcell'))&&!liveDateOk(S.date)){toast('이 날짜는 출석부에 칸이 없어요. 금요철야와 주일예배만 기록할 수 있어요');return}
  if(t.hasAttribute('data-svc')||t.hasAttribute('data-cell')||t.hasAttribute('data-allcell')){
    var gk=t.getAttribute('data-allcell')||((byId(t.getAttribute('data-id'))||{}).group);if(!canEdit(gk)){toast(roMsg());return}}
  if(t.hasAttribute('data-mycell-open')){askMyCell(true);return}
  if(t.hasAttribute('data-svc')){
    var id=t.getAttribute('data-id'),v=t.getAttribute('data-svc'),cur=rec(S.date,id).svc;
    put(S.date,id,{svc:cur===v?null:v});lastOwn=Date.now();updateRow(id);afterChange();return}
  if(t.hasAttribute('data-cell')){
    var id2=t.getAttribute('data-id');put(S.date,id2,{cell:!rec(S.date,id2).cell});lastOwn=Date.now();updateRow(id2);afterChange();return}
  if(t.hasAttribute('data-allcell')){
    var gid=t.getAttribute('data-allcell'),ms=groupMembers(gid),d=S.date,before={};
    ms.forEach(function(m){before[m.id]=!!rec(d,m.id).cell});
    var allOn=ms.every(function(m){return before[m.id]});
    ms.forEach(function(m){put(d,m.id,{cell:!allOn});updateRow(m.id)});afterChange();lastOwn=Date.now();
    toast(gOf(gid).name+' '+ms.length+'명 셀모임을 '+(allOn?'해제했어요':'체크했어요'),function(){ms.forEach(function(m){put(d,m.id,{cell:before[m.id]})});if(S.date===d){ms.forEach(function(m){updateRow(m.id)});afterChange()}});
    return}
  if(t.hasAttribute('data-notice')){var ni=t.getAttribute('data-notice');S.openNotice=S.openNotice===ni?null:ni;S.delArm=null;renderHome();return}
  if(t.hasAttribute('data-allnotices')){S.allNotices=!S.allNotices;renderHome();return}
  if(t.hasAttribute('data-newnotice')){if(S.admin)openNoticeEditor();else openAdminLogin('new');return}
  if(t.hasAttribute('data-newsedit')){if(S.admin)openInstaEditor();else openAdminLogin('insta');return}
  if(t.hasAttribute('data-copylink')){var lk=INSTA.post;
    try{navigator.clipboard.writeText(lk).then(function(){toast('게시물 링크를 복사했어요. 셀톡방에 붙여 넣어 주세요')},function(){window.prompt('아래 링크를 길게 눌러 복사해 주세요',lk)})}catch(err){window.prompt('아래 링크를 길게 눌러 복사해 주세요',lk)}
    return}
  if(t.hasAttribute('data-editnotice')){openNoticeEditor(t.getAttribute('data-editnotice'));return}
  if(t.hasAttribute('data-delnotice')){var di=t.getAttribute('data-delnotice');
    if(S.delArm===di){NOTICES=NOTICES.filter(function(x){return x.id!==di});if(LIVE_URL)liveQueue({a:'notice_del',id:di,admin:adminCode()});S.delArm=null;S.openNotice=null;toast('일정을 삭제했어요')}else S.delArm=di;
    renderHome();return}
  if(t.hasAttribute('data-gocheck')){S.date=focusMeeting();clampDates();go('check');return}
  if(t.hasAttribute('data-date')){var nd0=t.getAttribute('data-date');if(S.tab==='home'){S.date=nd0;go('check');return}
    if(S.date===nd0)return;S.date=nd0;renderCheck();return}
  if(t.hasAttribute('data-week')){
    var ws=addDays(weekStart(S.date),7*Number(t.getAttribute('data-week')));
    var cand=[ws,addDays(ws,5)].filter(inYear);var pastC=cand.filter(function(d){return d<=TODAY});
    S.date=pastC.length?pastC[pastC.length-1]:cand[0];render();return}
  if(t.hasAttribute('data-opencal')){openCal();return}
  if(t.hasAttribute('data-g')){S.group=t.getAttribute('data-g');render();return}
  if(t.hasAttribute('data-mnav')){var nm=shiftMonth(S.month,Number(t.getAttribute('data-mnav')));if(nm<Y0.slice(0,7)||nm>Y1.slice(0,7))return;S.month=nm;render();return}
  if(t.hasAttribute('data-measure')){S.smeasure=t.getAttribute('data-measure');render();return}
  if(t.hasAttribute('data-rg')){S.rg=t.getAttribute('data-rg');render();return}
  if(t.hasAttribute('data-person')){openPerson(t.getAttribute('data-person'));return}
  if(t.hasAttribute('data-retry')){liveEnsure();return}
  if(t.hasAttribute('data-copyweek')){copyWeek();return}
  if(t.hasAttribute('data-add')){if(S.admin)openAdd();else openAdminLogin('add');return}
});
main.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value.trim();renderGroups()}
  if(e.target.id==='rq'){S.rq=e.target.value.trim();renderPlist()}
});
$('#installBtn').addEventListener('click',openInstall);

/* ---------- tabs ---------- */
function go(tab){S.tab=tab;Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){if(b.getAttribute('data-tab')===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render();window.scrollTo(0,0)}
/* 같은 탭을 다시 그릴 때는 칩 줄(가로 스크롤) 위치를 그대로 둬요 (11-25 사용자 요청) */
var lastTab=null;
function render(){if(LIVE_URL&&!liveReady()){liveEnsure();return}
  var xs=lastTab===S.tab?Array.prototype.map.call(main.querySelectorAll('.scrollx'),function(e){return e.scrollLeft}):[];lastTab=S.tab;
  if(S.tab==='home')renderHome();else if(S.tab==='check')renderCheck();else if(S.tab==='stats')renderStats();else renderRoster();
  Array.prototype.forEach.call(main.querySelectorAll('.scrollx'),function(e,i){if(xs[i])e.scrollLeft=xs[i]})}
document.querySelector('.nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;var tb=b.getAttribute('data-tab');
  if(tb==='check'&&S.tab!=='check'){S.date=focusMeeting();clampDates()}   /* 다른 탭에서 출석으로 오면 지금 가장 관련 있는 모임부터 */
  go(tb)});

/* ---------- live: load from the sheet, save queue (works offline), my cell ---------- */
var LV={loaded:{},loading:{},dates:{},months:[],busy:false,q:[],err:0};
var Q_KEY='saengmyeong-queue',CELL_KEY='saengmyeong-mycell';
try{LV.q=JSON.parse(localStorage.getItem(Q_KEY)||'[]')||[]}catch(e){LV.q=[]}
function saveQ(){try{localStorage.setItem(Q_KEY,JSON.stringify(LV.q))}catch(e){}}
function viewYm(){return S.tab==='stats'?S.month:S.date.slice(0,7)}
function liveReady(){return !!LV.loaded[viewYm()]}
function liveDateOk(d){if(!LIVE_URL)return true;var l=LV.dates[d.slice(0,7)];return !!(l&&l.indexOf(d)>=0)}
function qs(o){return Object.keys(o).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k])}).join('&')}
function apiGet(o){return fetch(LIVE_URL+'?'+qs(o)).then(function(r){return r.json()})}
function apiPost(o){return fetch(LIVE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function liveQueue(op){op.code=entryCode();LV.q.push(op);saveQ();syncBadge();markPending();liveFlush()}
function liveFlush(){
  if(LV.busy||!LV.q.length)return;LV.busy=true;var op=LV.q[0];
  apiPost(op).then(function(res){
    LV.busy=false;
    if(res&&res.busy){setTimeout(liveFlush,2500);return}
    LV.err=0;LV.q.shift();saveQ();
    if(!res||!res.ok){toast((res&&res.error)||'저장하지 못했어요');if(res&&res.admin)setAdmin(false);liveLoad(viewYm()).then(renderSafe)}
    else if(/^(add|move|role)$/.test(op.a))liveLoad(viewYm()).then(renderSafe);
    syncBadge();markPending();liveFlush();
  },function(){LV.busy=false;LV.err++;syncBadge();setTimeout(liveFlush,Math.min(30000,2000*LV.err))});
}
function liveLoad(ym){
  if(LV.loading[ym])return LV.loading[ym];
  var p=apiGet({a:'load',ym:ym,code:entryCode()}).then(function(res){
    delete LV.loading[ym];
    if(res&&res.auth){try{localStorage.removeItem(PASS_KEY)}catch(e){}gate.hidden=false;throw new Error('입장 코드를 다시 입력해 주세요')}
    if(!res||!res.ok)throw new Error((res&&res.error)||'불러오지 못했어요');
    liveApply(res.data);saveSnap(res.data);LV.err=0;syncBadge();return res.data;
  }).catch(function(e){delete LV.loading[ym];LV.err++;syncBadge();
    if(!LV.loaded[viewYm()])main.innerHTML='<div class="empty"><p>출석부를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p><p style="font-size:12.5px">'+esc(e.message||'')+'</p><button type="button" class="btn" data-retry>다시 시도</button></div>'});
  LV.loading[ym]=p;return p;
}
function liveApply(d){
  if(d.today)TODAY=d.today;
  if(d.months&&d.months.length){LV.months=d.months;Y0=d.months[0]+'-01';var lm=d.months[d.months.length-1].split('-').map(Number);Y1=lm[0]+'-'+pad(lm[1])+'-'+pad(new Date(lm[0],lm[1],0).getDate())}
  LV.dates[d.ym]=d.dates||[];
  if(d.ym===viewYm()||!M.length){
    M.length=0;(d.members||[]).forEach(function(x,i){M.push({id:x.id,name:x.name,group:x.group,section:x.section,role:x.role||'',gender:x.gender||'',birth:x.birth||'',phone:x.phone||'',gen:x.gen||'',note:x.note||'',comment:x.comment||'',ord:i+1})});
    ordSeq=M.length;
    (d.groups||[]).forEach(function(g){var G=gOf(g.id);if(G)G.leader=g.leader||''});
  }
  Object.keys(A).forEach(function(k){if(k.slice(0,7)===d.ym)delete A[k]});
  Object.keys(d.att||{}).forEach(function(dt){Object.keys(d.att[dt]).forEach(function(n){A[dt]=A[dt]||{};A[dt][n]=d.att[dt][n]})});
  LV.q.forEach(function(op){if(op.a==='mark'&&op.date.slice(0,7)===d.ym){var p={};if('svc' in op)p.svc=op.svc;if('cell' in op)p.cell=op.cell;put(op.date,op.name,p,true)}});
  NOTICES=d.notices||[];
  if(d.insta)INSTA={post:d.insta.post||'',account:d.insta.account||''};
  LV.loaded[d.ym]=Date.now();
}
/* 마지막으로 받은 달 내용을 폰에 남겨 두고, 다음에 앱을 열면 먼저 보여준 뒤 서버 내용으로 바꿔요 (연락처는 남기지 않음) */
var SNAP_KEY='saengmyeong-snap-';
function saveSnap(d){try{var c=JSON.parse(JSON.stringify(d));delete c.today;(c.members||[]).forEach(function(m){m.phone=''});localStorage.setItem(SNAP_KEY+d.ym,JSON.stringify(c));
  var keep=[SNAP_KEY+d.ym,SNAP_KEY+viewYm()];for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf(SNAP_KEY)===0&&keep.indexOf(k)<0)localStorage.removeItem(k)}}catch(e){}}
function loadSnap(ym){try{return JSON.parse(localStorage.getItem(SNAP_KEY+ym)||'null')}catch(e){return null}}
function firstMeetingFrom(k){var d=k;for(var i=0;i<14;i++){if(kindOf(d)!=='etc')return d;d=addDays(d,1)}return k}
function clampDates(){if(S.date<Y0)S.date=firstMeetingFrom(Y0);if(S.date>Y1)S.date=lastMeetingOnOrBefore(Y1);if(S.month<Y0.slice(0,7))S.month=Y0.slice(0,7);if(S.month>Y1.slice(0,7))S.month=Y1.slice(0,7)}
function homeDay(){var d=lastMeetingOnOrBefore(TODAY);return d<Y0?firstMeetingFrom(Y0):d}
function renderSafe(){var ae=document.activeElement;if(ae&&main.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;clampDates();var y=window.scrollY;render();window.scrollTo(0,y);markPending()}
function liveEnsure(){if(LV.loading[viewYm()])return;main.innerHTML='<p class="empty">출석부를 불러오는 중이에요…</p>';liveLoad(viewYm()).then(function(d){if(d)renderSafe()})}
function liveStart(){
  var draft=document.querySelector('.draft');if(draft)draft.hidden=true;   /* "시안 화면이에요" 안내는 미리보기에서만 */
  syncBadge();
  main.innerHTML='<p class="empty">출석부를 불러오는 중이에요…</p>';
  var snap=loadSnap(viewYm());if(snap&&snap.ym===viewYm()){liveApply(snap);clampDates();renderSafe()}
  liveLoad(viewYm()).then(function(d){if(!d)return;clampDates();if(!liveReady())liveEnsure();else renderSafe();if(passed())askMyCell();sayHello()});
  setInterval(function(){if(document.hidden)return;liveFlush();liveLoad(viewYm()).then(function(d){if(d)renderSafe()})},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){liveFlush();liveLoad(viewYm()).then(function(d){if(d)renderSafe()})}});
  window.addEventListener('online',liveFlush);
  liveFlush();
}
function syncBadge(){var b=document.querySelector('.sync');if(!b)return;var n=LV.q.length,off=LV.err>0;
  b.classList.toggle('off',off);b.lastChild.textContent=n?(off?'저장 대기 '+n:'저장 중'):(off?'연결 끊김':'실시간');
  b.title=n?'아직 시트에 저장되지 않은 기록이 '+n+'개 있어요. 연결되면 자동으로 저장돼요.':'다른 사람이 입력한 내용이 몇 초 안에 나타나요'}
function markPending(){var p={};LV.q.forEach(function(op){if(op.a==='mark'&&op.date===S.date)p[op.name]=1});
  Array.prototype.forEach.call(main.querySelectorAll('.prow'),function(r){r.classList.toggle('pend',!!p[r.getAttribute('data-row')])})}
function myCell(){try{return localStorage.getItem(CELL_KEY)||''}catch(e){return ''}}
function myCellName(){var g=gOf(myCell());return g?(g.id==='staff'?'총무단, 새가족':g.name):'안 고름'}
function askMyCell(force){if(!force&&myCell())return;if(!force&&!sheet.hidden)return;
  openSheet('<h2>어느 셀이세요?</h2><p>한 번만 고르면 돼요. 주일 저녁 8시 30분에 출석체크가 안 된 셀에만 가는 알림에 써요. 설정(🔔)에서 언제든 바꿀 수 있어요.</p>'+
    '<div class="cellpick">'+GROUPS.map(function(g){return '<button type="button" class="btn'+(myCell()===g.id?' primary':'')+'" data-mycell="'+g.id+'">'+(g.id==='staff'?'총무단, 새가족':g.name+(g.leader?' <small>'+esc(g.leader)+'</small>':''))+'</button>'}).join('')+'</div>')}
/* 카톡에 붙여넣을 이번 주 요약 */
function weekReport(){
  var ws=weekStart(S.date),wa=ws.split('-').map(Number),ORD=['첫째','둘째','셋째','넷째','다섯째'];
  var out=['[생명교구] '+wa[1]+'월 '+ORD[Math.ceil(wa[2]/7)-1]+' 주 출석'];
  weekDays().filter(function(d){return kindOf(d)!=='etc'&&(d<=TODAY||hasRec(d))}).forEach(function(d){var s=sumDay(d),k=kindOf(d);
    if(k==='sun'){out.push('','▪ '+sd(d)+' 주일예배 '+s.total+'명','  5부 현장 '+s.site+' · 5부 온라인 '+s.online+' · 대예배 '+s.main,'  셀모임 '+s.cell+'명');
      out.push('  셀별 예배: '+GROUPS.map(function(g){return (g.id==='staff'?'총무단':g.name)+' '+sumDay(d,g.id).total}).join(' · '))}
    else out.push('','▪ '+sd(d)+' 금요철야 '+s.total+'명','  현장 '+s.site+' · 온라인 '+s.online)});
  if(out.length===1)out.push('','아직 기록된 모임이 없어요.');
  return out.join('\n')}
function copyWeek(){var t=weekReport();
  function fallback(){openSheet('<h2>이번 주 요약</h2><p>아래 글을 길게 눌러 복사해 주세요.</p><textarea class="copybox" readonly rows="12">'+esc(t)+'</textarea><div class="actions"><button type="button" class="btn" data-close>닫기</button></div>')}
  try{navigator.clipboard.writeText(t).then(function(){toast('이번 주 요약을 복사했어요. 카톡에 붙여넣으세요')},fallback)}catch(e){fallback()}}

/* ---------- entry code: only the server knows the real code (the page source is public).
   The app keeps the code the leader typed and sends it with every request. The preview accepts any code. ---------- */
var PASS_KEY='saengmyeong-pass';
function entryCode(){try{return localStorage.getItem(PASS_KEY)||''}catch(e){return ''}}
function passed(){return !!entryCode()}
var gate=$('#gate'),liveStarted=false;
function startApp(){if(!LIVE_URL){render();return}if(liveStarted)return;liveStarted=true;liveStart()}
if(!passed()){gate.hidden=false;setTimeout(function(){var i=$('#gate-code');i&&i.focus()},80)}
$('#gateform').addEventListener('submit',function(e){
  e.preventDefault();var inp=$('#gate-code'),v=inp.value.trim().toLowerCase(),err=$('#gate-err');
  function bad(msg){err.textContent=msg;gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');inp.select()}
  if(!v){bad('입장 코드를 입력해 주세요.');return}
  function ok(){try{localStorage.setItem(PASS_KEY,v)}catch(err2){}gate.hidden=true;toast('환영해요. 이제 출석을 기록할 수 있어요.');
    if(LIVE_URL){if(liveStarted)liveLoad(viewYm()).then(function(d){if(d)renderSafe()});else startApp();setTimeout(function(){askMyCell()},600)}}
  if(!LIVE_URL){ok();return}
  err.textContent='확인 중이에요…';
  apiGet({a:'ping',code:v}).then(function(res){if(res&&res.ok){err.textContent='';ok()}else bad('코드가 맞지 않아요. 다시 확인해 주세요.')},function(){bad('인터넷 연결을 확인해 주세요.')});
});

if(!LIVE_URL)render();else if(passed())startApp();else main.innerHTML='<p class="empty">입장 코드를 넣으면 출석부를 불러와요.</p>';
})();
</script>
